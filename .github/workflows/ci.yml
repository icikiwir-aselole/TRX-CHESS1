name: trx-chess-ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 9.4 (gradlew delegates to system gradle)
        run: |
          curl -fL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.4.0-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.4.0/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew test --console=plain
      - run: ./gradlew :app:lintDebug --console=plain
      - run: ./gradlew :app:assembleRelease --console=plain
